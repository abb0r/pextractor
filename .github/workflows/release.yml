name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Build Windows executable
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o pExtractor.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: pExtractor.exe

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//49 org.gnome.Sdk//49 org.freedesktop.Sdk.Extension.golang//25.08
      - name: Build Flatpak bundle
        run: |
          flatpak-builder --disable-rofiles-fuse --force-clean --repo=repo build-dir io.github.abb0r.pextractor.yml
          flatpak build-bundle repo pExtractor.flatpak io.github.abb0r.pextractor
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: pExtractor.flatpak

  release:
    needs: [windows, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" windows/pExtractor.exe flatpak/pExtractor.flatpak --title "pExtractor ${GITHUB_REF_NAME}" --notes-file - <<EOF
          ## pExtractor ${GITHUB_REF_NAME}

          - Dark interface and program icon.
          - The server address, token, and certificate option are remembered.
          - A text export contains only the titles or artists, one per line.

          - Windows: download `pExtractor.exe` and run it. No installation is required.
          - Linux: install `pExtractor.flatpak`. Flatpak downloads the GNOME runtime from Flathub if needed.

          ```
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user ./pExtractor.flatpak
          flatpak run io.github.abb0r.pextractor
          ```
          EOF
