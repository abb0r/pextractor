id: io.github.abb0r.pextractor
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: pextractor
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --filesystem=xdg-download
modules:
  - name: pextractor
    buildsystem: simple
    build-commands:
      - install -Dm755 pextractor /app/bin/pextractor
      - install -Dm644 io.github.abb0r.pextractor.desktop /app/share/applications/io.github.abb0r.pextractor.desktop
      - install -Dm644 io.github.abb0r.pextractor.metainfo.xml /app/share/metainfo/io.github.abb0r.pextractor.metainfo.xml
      - install -Dm644 io.github.abb0r.pextractor.svg /app/share/icons/hicolor/scalable/apps/io.github.abb0r.pextractor.svg
    sources:
      - type: file
        path: pextractor
      - type: file
        path: io.github.abb0r.pextractor.desktop
      - type: file
        path: io.github.abb0r.pextractor.metainfo.xml
      - type: file
        path: io.github.abb0r.pextractor.svg
